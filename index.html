// ─── Parse filename into metadata ────────────────────────────────────────────
// Expected filename pattern: TZF 2026 - DAY 2 - C5436
// Falls back gracefully for other names
function parseName(name) {
  // Remove extension
  const base = name.replace(/\.(mp4|mov|avi|mkv|webm)$/i, "");
  const dayMatch = base.match(/day\s*(\d)/i);
  const codeMatch = base.match(/[cC](\d{4,5})/);
  const tzfMatch = base.match(/tzf\s*(\d+)/i);
  const cats = ["Workshop","Jack & Jill","Party","Pre-party","Social Dance"];
  // simple heuristic by code suffix
  const idx = (codeMatch || tzfMatch) ? parseInt((codeMatch || tzfMatch)[1]) % cats.length : 0;
  return {
    day:      dayMatch ? `Day ${dayMatch[1]}` : "Day 1",
    code:     codeMatch ? `C${codeMatch[1]}` : tzfMatch ? `TZF ${tzfMatch[1]}` : base.slice(0,10),
    category: cats[idx],
    title:    base,
  };
}

function mapDriveFilesToVideos(files) {
  return files.map((file) => {
    const meta = parseName(file.name);
    return {
      id: file.id,
      gdFileId: file.id,
      code: meta.code,
      title: meta.title,
      day: meta.day,
      category: meta.category,
      price: VIDEO_PRICE,
      fileName: file.name,
    };
  });
}

async function fetchDriveFeed() {
  if (!DRIVE_FEED_URL) return null;
  try {
    const url = `${DRIVE_FEED_URL}${DRIVE_FEED_URL.includes("?") ? "&" : "?"}t=${Date.now()}`;
    const response = await fetch(url, { cache: "no-store" });
    if (!response.ok) throw new Error(`Feed request failed: ${response.status}`);
    const payload = await response.json();
    if (!Array.isArray(payload?.files)) throw new Error("Feed payload missing files array.");
    return payload.files
      .filter(file => file?.id && file?.name)
      .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" }));
  } catch (error) {
    console.error("Drive feed fetch failed", error);
    return null;
  }
}

// ─── Local preview manifest ───────────────────────────────────────────────────
async function fetchManifest() {
  try {
    const res = await fetch("public/previews/manifest.json", { cache: "no-store" });
    if (!res.ok) return {};
    const entries = await res.json();
    const map = {};
    entries.forEach(e => { map[e.name] = { previewUrl: e.preview, thumbUrl: e.thumb }; });
    return map;
  } catch { return {}; }
}

function enrichVideos(videos, previewMap) {
  return videos.map(v => {
    const m = previewMap[v.fileName];
    return m ? { ...v, localUrl: m.previewUrl, thumbUrl: m.thumbUrl } : v;
  });
}

// ─── Upload Zone ─────────────────────────────────────────────────────────────
function UploadZone({ onFilesAdded }) {
  const [dragging, setDragging] = useState(false);
  const inputRef = useRef(null);

  const processFiles = useCallback((fileList) => {
    const videos = [];
    const cats = ["Social Dance","Workshop","Jack & Jill","Party","Pre-party"];
    Array.from(fileList).forEach((file, i) => {
      if (!file.type.startsWith("video/")) return;
      const meta = parseName(file.name);
      const objectUrl = URL.createObjectURL(file);
      videos.push({
        id: `upload_${Date.now()}_${i}`,
        gdFileId: null,
        localUrl: objectUrl,
        code: meta.code,
        title: meta.title,
        day: meta.day,
        category: meta.category,
        price: VIDEO_PRICE,
        fileName: file.name,
      });
    });
    if (videos.length > 0) onFilesAdded(videos);
  }, [onFilesAdded]);

  const onDrop = e => {
    e.preventDefault(); setDragging(false);
    processFiles(e.dataTransfer.files);
  };

  return (
    <div
      onDragOver={e => { e.preventDefault(); setDragging(true); }}
      onDragLeave={() => setDragging(false)}
      onDrop={onDrop}
      onClick={() => inputRef.current?.click()}
      style={{
        border: `2px dashed ${dragging ? "var(--gold)" : "rgba(255,255,255,0.12)"}`,

        padding: "28px 20px",
        textAlign: "center",
        cursor: "pointer",

        transition: "all 0.18s",

        accept="video/*"
        multiple

function TenSecondPreviewVideo({ src }) {
  const ref = useRef(null);
  const [ended, setEnded] = useState(false);
  const PREVIEW_SECONDS = 10;

  const restart = () => {
    const el = ref.current;
    if (!el) return;
    el.currentTime = 0;
    setEnded(false);
    el.play().catch(() => {});
  };

  const stopAtPreviewLimit = e => {
    if (e.currentTarget.currentTime < PREVIEW_SECONDS) return;
    e.currentTarget.pause();
    e.currentTarget.currentTime = PREVIEW_SECONDS;
    setEnded(true);
  };

  return (
    <>
      <video
        ref={ref}
        src={src}
        autoPlay
        playsInline
        controls
        preload="auto"
        onLoadedMetadata={e => { e.currentTarget.currentTime = 0; e.currentTarget.play().catch(()=>{}); }}
        onTimeUpdate={stopAtPreviewLimit}
        onSeeking={stopAtPreviewLimit}
        style={{
          position:"absolute",inset:0,
          width:"100%",height:"100%",
          objectFit:"contain",background:"#000",
        }}
      />
      {ended && (
        <button onClick={restart} style={{
          position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",
          zIndex:12,padding:"10px 16px",borderRadius:8,
          background:"rgba(0,0,0,0.72)",border:"1px solid rgba(255,255,255,0.22)",
          color:"white",fontSize:13,fontWeight:700,cursor:"pointer",
          backdropFilter:"blur(8px)",
        }}>Replay 10s Preview · 重看 10 秒</button>
      )}
    </>
  );
}

              position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",
              opacity:0.3,pointerEvents:"none",flexShrink:0,
            }} width="13" height="13" viewBox="0 0 13 13" fill="none">
              <circle cx="5.5" cy="5.5" r="4" stroke="white" strokeWidth="1.4"/>
              <path d="M9 9l2.5 2.5" stroke="white" strokeWidth="1.4" strokeLinecap="round"/>
            </svg>
            <input
              value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Search videos · 搜尋影片…"
              style={{
                width:"100%",padding:"7px 11px 7px 30px",
                background:"rgba(255,255,255,0.055)",
                border:"1px solid var(--border)",borderRadius:7,
                color:"var(--text)",fontSize:13,outline:"none",
                fontFamily:"var(--font-body)",transition:"border-color 0.15s",
              }}
            />
          </div>

          <div style={{flex:1}}/>

          {/* Contact */}
          <a
            href="https://www.instagram.com/jimframe/"
            target="_blank"
            rel="noopener noreferrer"
            style={{
              display:"flex",alignItems:"center",gap:7,
              background:"rgba(255,255,255,0.035)",
              border:"1px solid var(--border)",borderRadius:7,
              padding:"7px 12px",color:"var(--text-muted)",
              fontSize:13,fontWeight:600,textDecoration:"none",
            }}
          >
            <span style={{color:"var(--gold)"}}>@jimframe</span>
          </a>

          {/* Cart */}
          <button
            onClick={() => setCartOpen(v=>!v)}
            style={{
              display:"flex",alignItems:"center",gap:7,
              background:"rgba(255,255,255,0.06)",
              border:"1px solid var(--border)",borderRadius:7,
              padding:"7px 14px",cursor:"pointer",
              color:"var(--text)",fontSize:13,fontWeight:500,
              transition:"border-color 0.15s",
            }}
          >
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
              <path d="M1 1h2l1.5 8h7l1.5-5H4" stroke="currentColor" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/>
              <circle cx="6.5" cy="12.5" r="1" fill="currentColor"/>
              <circle cx="10.5" cy="12.5" r="1" fill="currentColor"/>
            </svg>
            Cart
            {cart.length > 0 && (
              <span style={{
                background:"var(--gold)",color:"#1a1100",
                borderRadius:"50%",width:17,height:17,
                display:"flex",alignItems:"center",justifyContent:"center",
                fontSize:9,fontWeight:700,
              }}>{cart.length}</span>
            )}
          </button>
        </div>
      </header>

      {/* ── Hero banner ── */}
      <div style={{maxWidth:1600,margin:"0 auto",padding:"32px 28px 0"}}>
        <div style={{
          padding:"36px 44px",borderRadius:12,
          background:"linear-gradient(130deg, rgba(200,160,60,0.07) 0%, rgba(255,255,255,0.015) 55%)",
          border:"1px solid var(--border)",marginBottom:28,
          position:"relative",overflow:"hidden",
        }}>
          {/* subtle grid lines */}
          <svg style={{position:"absolute",right:0,top:0,opacity:0.03,pointerEvents:"none"}}
            width="420" height="180" viewBox="0 0 420 180">
            {Array.from({length:9},(_,i)=>(
              <line key={i} x1={i*50} y1="0" x2={i*50+180} y2="180" stroke="white" strokeWidth="1"/>
            ))}
          </svg>

          <div style={{display:"flex",alignItems:"flex-end",justifyContent:"space-between",flexWrap:"wrap",gap:20}}>
            <div>
              <div style={{
                fontSize:10,fontWeight:700,letterSpacing:2.5,
                color:"var(--gold)",textTransform:"uppercase",marginBottom:10,
              }}>film by Jim</div>
              <h1 style={{
                fontFamily:"var(--font-display)",
                fontSize:"clamp(26px,3.5vw,50px)",
                fontWeight:400,lineHeight:1.1,
                color:"var(--text)",marginBottom:10,
                letterSpacing:"-0.02em",
              }}>Taiwan Zouk Festival<br/><em>2026</em></h1>
              <p style={{fontSize:13,color:"var(--text-muted)",maxWidth:460,lineHeight:1.6}}>
                {videos.length} cloud videos loaded from Google Drive · Watermark preview · Message @jimframe after payment
              </p>
              <a
                href="https://www.instagram.com/jimframe/"
                target="_blank"
                rel="noopener noreferrer"
                style={{
                  display:"inline-flex",alignItems:"center",gap:8,
                  marginTop:14,padding:"8px 12px",
                  border:"1px solid rgba(200,160,60,0.24)",
                  borderRadius:7,background:"var(--gold-bg)",
                  color:"var(--gold)",fontSize:12,fontWeight:700,
                  textDecoration:"none",letterSpacing:0.2,
                }}
              >
                Contact · 聯絡 @jimframe
              </a>
            </div>
            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
              <div style={{
                padding:"12px 18px",background:"var(--gold-bg)",
                border:"1px solid rgba(200,160,60,0.22)",borderRadius:8,textAlign:"center",
              }}>
                <div style={{fontSize:24,fontWeight:700,color:"var(--gold)",fontFamily:"var(--font-display)"}}>{videos.length || "—"}</div>
                <div style={{fontSize:10,color:"var(--text-muted)",marginTop:2}}>Videos · 支影片</div>
              </div>
              <div style={{
                padding:"12px 18px",background:"rgba(255,255,255,0.03)",
                border:"1px solid var(--border)",borderRadius:8,textAlign:"center",
              }}>
                <div style={{fontSize:30,fontWeight:800,color:"var(--gold)",fontFamily:"var(--font-display)"}}>US${VIDEO_PRICE}</div>
                <div style={{fontSize:10,color:"var(--text-muted)",marginTop:2}}>Per video · 單支</div>
              </div>
            </div>
          </div>
        </div>

        {/* ── Filters ── */}
        <div style={{
          display:"flex",gap:10,alignItems:"center",
          flexWrap:"wrap",marginBottom:18,
        }}>
          {syncMessage && (
            <div style={{
              width:"100%",marginBottom:2,
              fontSize:11,color:"var(--text-dim)",
            }}>{syncMessage}</div>
          )}
          {/* Category pills */}
          <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
            {CATEGORIES.map(cat => (
              <button key={cat} onClick={()=>setActiveCategory(cat)} style={{
                padding:"5px 13px",borderRadius:20,fontSize:11,fontWeight:activeCategory===cat?700:400,
                cursor:"pointer",transition:"all 0.15s",
                background: activeCategory===cat ? "var(--gold)" : "rgba(255,255,255,0.05)",
                border: `1px solid ${activeCategory===cat ? "var(--gold)" : "var(--border)"}`,
                color: activeCategory===cat ? "#1a1100" : "var(--text-muted)",
              }}>{cat}</button>
            ))}
          </div>
          <div style={{width:1,height:20,background:"var(--border)",flexShrink:0}}/>
          {/* Day pills */}
          <div style={{display:"flex",gap:5}}>
            {DAYS.map(d => (
              <button key={d} onClick={()=>setActiveDay(d)} style={{
                padding:"5px 11px",borderRadius:20,fontSize:11,
                fontWeight:activeDay===d?600:400,cursor:"pointer",
                background: activeDay===d ? "rgba(255,255,255,0.09)" : "rgba(255,255,255,0.03)",
                border: `1px solid ${activeDay===d ? "rgba(255,255,255,0.18)" : "var(--border)"}`,
                color: activeDay===d ? "var(--text)" : "var(--text-muted)",
              }}>{d}</button>
            ))}
          </div>
          <div style={{flex:1}}/>
          {/* Sort */}
          <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{
            padding:"5px 10px",background:"var(--surface2)",
            border:"1px solid var(--border)",borderRadius:6,
            color:"var(--text-muted)",fontSize:11,cursor:"pointer",outline:"none",
          }}>
            <option value="default">Default order</option>
            <option value="code">By code · 依編號</option>
            <option value="day">By day · 依日期</option>
          </select>
          <span style={{fontSize:11,color:"var(--text-dim)"}}>{filtered.length} videos</span>
        </div>

        {/* ── Grid ── */}
        {filtered.length > 0 ? (
          <div style={{
            display:"grid",
            gridTemplateColumns:`repeat(${cols}, minmax(0,1fr))`,
            gap: tweaks.compactCards ? 10 : 16,
            paddingBottom:80,
          }}>
            {filtered.map(v => (
              <VideoCard key={v.id} video={v}
                inCart={cart.includes(v.id)}
                onAddCart={addCart} onRemoveCart={removeCart}
                onOpen={setSelectedVideo}
                onPrefetch={prefetchVideo}
                compact={tweaks.compactCards}
              />
            ))}
          </div>
        ) : (
          <div style={{textAlign:"center",padding:"80px 0",color:"var(--text-dim)"}}>
            <div style={{fontSize:32,marginBottom:10}}>🎬</div>
            <div style={{fontSize:15}}>No videos found · 找不到影片</div>
            <div style={{fontSize:12,marginTop:6}}>Try a different search or filter</div>
          </div>
        )}
      </div>

      {/* Overlays */}
      {cartOpen && (
        <CartSidebar cart={cart} videos={videos}
          onRemove={removeCart} onClose={()=>setCartOpen(false)}
        />
      )}
      {selectedVideo && (
        <VideoModal video={selectedVideo}
          inCart={cart.includes(selectedVideo.id)}
          onAddCart={addCart} onRemoveCart={removeCart}
          onClose={()=>setSelectedVideo(null)}
          onBuyNow={v=>{setSelectedVideo(null); setBuyVideo(v);}}
        />
      )}
      {prefetchedDriveId && (
        <iframe
          src={gdEmbed(prefetchedDriveId)}
          title="Drive preview prefetch"
          aria-hidden="true"
          tabIndex="-1"
          style={{
            position:"fixed",
            width:1,
            height:1,
            opacity:0,
            pointerEvents:"none",
            left:-9999,
            bottom:-9999,
            border:"none",
          }}
        />
      )}
      {buyVideo && (
        <BuyNowModal video={buyVideo}
          onClose={()=>setBuyVideo(null)}
        />
      )}

      {/* ── Tweaks ── */}
      <TweaksPanel>
        <TweakSection label="Layout · 格局">
          <TweakRadio label="Columns · 欄數" id="gridCols" options={["3","4","5","6"]}/>
          <TweakToggle label="Compact cards · 緊湊" id="compactCards"/>
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
